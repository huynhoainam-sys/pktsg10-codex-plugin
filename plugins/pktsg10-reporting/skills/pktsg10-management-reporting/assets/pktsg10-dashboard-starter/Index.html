<!doctype html>
<html lang="vi">
  <head><base target="_top"><meta name="viewport" content="width=device-width, initial-scale=1"><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script><style>
    :root{--navy:#0b2545;--blue:#1d5fa7;--orange:#f59e0b;--green:#198754;--red:#dc3545;--ink:#172033;--muted:#687386;--surface:#f4f7fb;--border:#d8e0ea}*{box-sizing:border-box}body{margin:0;background:var(--surface);color:var(--ink);font:14px Arial,sans-serif}header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;justify-content:space-between;gap:16px;align-items:center}h1{font-size:20px;margin:0}button{border:0;border-radius:6px;padding:9px 12px;cursor:pointer;background:var(--orange);font-weight:700}main{max-width:1280px;margin:auto;padding:18px}.meta{color:var(--muted);margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card,.panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:0 2px 8px #0b25450d}.label{color:var(--muted);font-size:12px}.value{font-size:28px;font-weight:700;margin-top:8px}.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;margin-top:12px}.panel h2{font-size:15px;margin:0 0 12px}.chart-wrap{height:320px}.ok{color:var(--green)}.stale{color:var(--red)}.empty{padding:28px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}th{background:#eef3f9;color:var(--navy)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.layout{grid-template-columns:1fr}.chart-wrap{height:260px}header{align-items:flex-start;flex-direction:column}}
  </style></head>
  <body><header><h1>PKTSG10 — Dashboard điều hành</h1><button onclick="refresh(true)">Refresh now</button></header><main><p id="meta" class="meta">Đang tải dữ liệu…</p><section id="kpis" class="grid"></section><section class="layout"><div class="panel"><h2>Xu hướng chính</h2><div class="chart-wrap"><canvas id="trend"></canvas></div></div><div class="panel"><h2>Exception cần xử lý</h2><div id="exceptions" class="empty">Đang tải…</div></div></section></main><script>
    let chart;const REFRESH_MS=60000;const numberValue=v=>Number(String(v).replace(/[^0-9.-]/g,''))||0;function render(p,stale=false){const rows=p.rows||[],h=rows.length?Object.keys(rows[0]):[],n=h.filter(x=>rows.some(r=>numberValue(r[x])!==0)).slice(0,4);document.querySelector('#meta').innerHTML=`Nguồn: ${p.sourceTab} · Cập nhật: ${new Date(p.generatedAt).toLocaleString('vi-VN')} · <span class="${stale?'stale':'ok'}">${stale?'STALE':'OK'}</span>`;document.querySelector('#kpis').innerHTML=n.map(x=>`<div class="card"><div class="label">${x}</div><div class="value">${rows.reduce((s,r)=>s+numberValue(r[x]),0).toLocaleString('vi-VN')}</div></div>`).join('')||'<div class="card empty">Chưa có KPI</div>';const l=rows.slice(-12).map((_,i)=>String(i+1)),s=n[0]?rows.slice(-12).map(r=>numberValue(r[n[0]])):[];if(chart)chart.destroy();chart=new Chart(document.querySelector('#trend'),{type:'line',data:{labels:l,datasets:[{label:n[0]||'KPI',data:s,borderColor:'#1d5fa7',backgroundColor:'#1d5fa733',fill:true,tension:.25}]},options:{responsive:true,maintainAspectRatio:false}});document.querySelector('#exceptions').innerHTML=rows.length?`<table><thead><tr>${h.slice(0,3).map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.slice(0,8).map(r=>`<tr>${h.slice(0,3).map(x=>`<td>${r[x]??''}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">Không có dữ liệu</div>'}function refresh(){google.script.run.withSuccessHandler(p=>render(p,false)).withFailureHandler(e=>{document.querySelector('#meta').innerHTML=`<span class="stale">Lỗi tải dữ liệu: ${e.message||e}</span>`}).getDashboardPayload()}refresh();setInterval(()=>refresh(false),REFRESH_MS);
  </script></body>
</html>
